# Syncs the XQuery 4.0 EBNF grammar from the upstream REx sample grammars,
# applies XQUF and eXist-DB mutations, regenerates the TypeScript parser with
# REx, and refreshes the QT4 snapshots. If nothing changed it does nothing; if
# there are no new failures it pushes straight to main; otherwise it creates (or
# updates, dependabot-style) a single PR on the fixed branch chore/update-parser.
# Runs weekly (Mondays 06:00 UTC) and can be triggered manually.
name: Sync XQuery 4.0 grammar from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Use Node.js latest
      uses: actions/setup-node@v4
      with:
        node-version: node
        cache: 'npm'
    - run: npm ci
    - name: Download XQuery 4 grammar
      run: curl https://raw.githubusercontent.com/GuntherRademacher/rex-parser-generator/main/docs/sample-grammars/XQuery-40.ebnf > ./rawgrammars/XQuery-40.ebnf
    - name: Apply changes on XQuery 4 grammar
      run: node --experimental-strip-types ./src/index.ts ./rawgrammars/XQuery-40.ebnf > transformedgrammars/XQuery-40-full.ebnf

    - name: Install REx parser
      run: |
        git clone https://github.com/GuntherRademacher/rex-parser-generator.git
        cd rex-parser-generator
        rex/scripts/build-gpp.sh

    - name: Run REx parser to make the new parser
      run: |
        ./rex-parser-generator/rex/build/bin/rex -typescript ./transformedgrammars/XQuery-40-full.ebnf -glalr 1 -a pi -tree
        cat parser_header.txt ./XQuery-40-full.ts > parsers/XQuery-40-full.ts
        rm ./XQuery-40-full.ts

    - name: Detect changes
      id: changes
      run: |
        if [ -z "$(git status --porcelain -- parsers rawgrammars transformedgrammars)" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Refresh QT4 snapshots
      if: steps.changes.outputs.changed == 'true'
      run: QT4_TESTS_DIR=qt4tests npm run update-snapshots

    - name: Check for new failures
      id: failures
      if: steps.changes.outputs.changed == 'true'
      run: |
        clean=true
        node scripts/new-failures.mjs || clean=false
        # Any other snapshot (e.g. smoke tests) changing also counts as a failure
        if ! git diff --quiet -- test ':!test/qt4/qt4-snaps'; then
          echo "Non-QT4 snapshots changed"
          clean=false
        fi
        echo "clean=$clean" >> $GITHUB_OUTPUT

    - name: Commit
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config --global user.email "bot@elliat.nl"
        git config --global user.name "Bot"
        git add -A parsers rawgrammars transformedgrammars test
        git commit -m "feat(parser): update parser to the newest spec"

    - name: Push directly to main (no new failures)
      if: steps.changes.outputs.changed == 'true' && steps.failures.outputs.clean == 'true'
      run: |
        git push origin HEAD:main
        # An open update PR is now obsolete
        OPEN=$(gh pr list --state open --json number,title --jq '[.[] | select(.title | startswith("feat(parser): update XQ40 parser"))][0].number')
        if [ -n "$OPEN" ]; then
          gh pr close "$OPEN" --delete-branch --comment "Superseded: the latest update had no new failures and was pushed directly to main."
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create or update PR (new failures)
      if: steps.changes.outputs.changed == 'true' && steps.failures.outputs.clean != 'true'
      run: |
        # Amend whatever update PR is already open (dependabot-style), else start one
        EXISTING=$(gh pr list --state open --json number,title,headRefName --jq '[.[] | select(.title | startswith("feat(parser): update XQ40 parser"))][0]')
        BRANCH=$(echo "$EXISTING" | jq -r '.headRefName // "chore/update-parser"')
        git push --force origin HEAD:refs/heads/$BRANCH
        if [ "$EXISTING" = "null" ] || [ -z "$EXISTING" ]; then
          gh pr create --head $BRANCH --base main \
            --title "feat(parser): update XQ40 parser to latest spec" \
            --body "Automated update of the XQuery 4.0 grammar and generated parser. This update introduces new QT4 failures; see the check output."
        fi
      env:
        GH_TOKEN: ${{ github.token }}
