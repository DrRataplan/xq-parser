name: Update QT4 testset

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: node
          cache: npm

      - run: npm ci

      - name: Get current submodule commit
        id: current
        run: echo "sha=$(git -C qt4tests rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get latest commit from qt4cg/qt4tests
        id: latest
        run: echo "sha=$(git ls-remote https://github.com/qt4cg/qt4tests.git refs/heads/master | cut -f1)" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.sha }}" = "${{ steps.latest.outputs.sha }}" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Update submodule to latest commit
        if: steps.check.outputs.needed == 'true'
        run: |
          cd qt4tests
          git fetch origin master
          git checkout ${{ steps.latest.outputs.sha }}
          cd ..
          git add qt4tests

      - name: Regenerate snapshots
        if: steps.check.outputs.needed == 'true'
        run: QT4_TESTS_DIR=qt4tests npm run update-snapshots

      - name: Check for new failures
        id: failures
        if: steps.check.outputs.needed == 'true'
        run: |
          clean=true
          node scripts/new-failures.mjs || clean=false
          echo "clean=$clean" >> $GITHUB_OUTPUT

      - name: Commit
        if: steps.check.outputs.needed == 'true'
        run: |
          SHORT="${{ steps.latest.outputs.sha }}"
          SHORT="${SHORT:0:7}"
          git config --global user.email "bot@elliat.nl"
          git config --global user.name "Bot"
          git add qt4tests test/qt4/qt4-snaps/
          git commit -m "chore: update QT4 testset to ${SHORT}"

      - name: Push directly to main (no new failures)
        if: steps.check.outputs.needed == 'true' && steps.failures.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          # An open update PR is now obsolete
          if [ -n "$(gh pr list --head chore/update-qt4tests --json number --jq '.[0].number')" ]; then
            gh pr close chore/update-qt4tests --delete-branch --comment "Superseded: the latest update had no new failures and was pushed directly to main."
          fi

      - name: Create or update PR (new failures)
        if: steps.check.outputs.needed == 'true' && steps.failures.outputs.clean != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${{ steps.latest.outputs.sha }}"
          SHORT="${SHORT:0:7}"
          BRANCH=chore/update-qt4tests
          git push --force origin HEAD:refs/heads/$BRANCH
          BODY="Updates qt4tests submodule to [\`${SHORT}\`](https://github.com/qt4cg/qt4tests/commit/${{ steps.latest.outputs.sha }}). This update introduces new failures."
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create --head "$BRANCH" --base main --title "chore: update QT4 testset to ${SHORT}" --body "$BODY"
          else
            gh pr edit "$EXISTING" --title "chore: update QT4 testset to ${SHORT}" --body "$BODY"
          fi
